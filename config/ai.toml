# 输入源配置
[input]
sources = []

# 输出目录配置
[output]
directory = "data"

# 运行模式配置
[run]
# 可选值: full | rerun_dropped
mode = "full"
# 重复运行次数，必须 >= 1。多次运行的结果会自动合并去重。
repeat_count = 1

# OpenAI 相关配置
[openai]
api_key = ""
base_url = "https://api.openai.com/v1"
model = "gpt-5.4-mini"
# 可选值: auto | responses | chat_completions
api_style = "auto"

# 抽取策略配置
[extraction]
# 可选值: auto | heuristic | llm
strategy = "auto"
